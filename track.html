{% extends "base.html" %}{% block title %}Track Order{% endblock %}{% block content %}<section class="auth"><h1>Track Your Order</h1><form id="trackForm"><input name="code" placeholder="Enter tracking code" required><button class="btn">TRACK</button></form><div id="result"></div></section><script>document.getElementById('trackForm').onsubmit=async(e)=>{e.preventDefault();let r=await fetch('/api/track',{method:'POST',body:new FormData(e.target)});let j=await r.json();document.getElementById('result').innerHTML=j.ok?`<div class="order"><b>${j.order}</b><span>${j.status}</span><span>${j.created}</span></div>`:`<p>${j.message}</p>`}</script>{% endblock %}
