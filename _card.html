<article class="card"><a href="{{url_for('product',slug=p.slug)}}"><div class="pic" style="background-image:url('{{p.image}}')"></div></a><div class="card-body"><div class="muted">{{p.category}}</div><h3><a href="{{url_for('product',slug=p.slug)}}">{{p.name}}</a></h3>{% if p.sale_price %}<del>PKR {{ "{:,.0f}".format(p.price) }}</del> <b>PKR {{ "{:,.0f}".format(p.sale_price) }}</b>{% else %}<b>PKR {{ "{:,.0f}".format(p.price) }}</b>{% endif %}</div></article>
