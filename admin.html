{% extends "base.html" %}{% block title %}Admin — Mughaliyaa Riyawaat{% endblock %}{% block content %}<section><h1>Admin Dashboard</h1><div class="stats"><div>{{products|length}}<small>Products</small></div><div>{{orders|length}}<small>Orders</small></div><div>{{users|length}}<small>Users</small></div></div><h2>Add Product</h2><form class="adminform" method="post" action="{{url_for('admin_product')}}"><input name="name" placeholder="Product name" required><input name="category" placeholder="Category" required><input name="price" type="number" placeholder="Price" required><input name="sale_price" type="number" placeholder="Sale price"><input name="stock" type="number" placeholder="Stock" required><input name="image" placeholder="Image URL"><input name="gallery" placeholder="Gallery URLs comma-separated"><input name="sizes" value="S,M,L,XL"><input name="colors" placeholder="Maroon,Green,Gold"><textarea name="description" placeholder="Description"></textarea><label><input type="checkbox" name="featured"> Featured</label><button class="btn">ADD PRODUCT</button></form><h2>Orders</h2>{% for o in orders %}<form class="order" method="post" action="{{url_for('admin_order',oid=o.id)}}"><b>{{o.order_no}}</b><span>{{o.user.phone}}</span><select name="status">{% for s in ['Pending','Confirmed','Packed','Shipped','Delivered','Cancelled'] %}<option {% if o.status==s %}selected{% endif %}>{{s}}</option>{% endfor %}</select><input name="tracking_code" value="{{o.tracking_code}}" placeholder="Tracking code"><select name="payment_status"><option {% if o.payment_status=='Pending' %}selected{% endif %}>Pending</option><option {% if o.payment_status=='Paid' %}selected{% endif %}>Paid</option></select><button>Save</button></form>{% endfor %}</section>{% endblock %}
