services:
  - type: web
    name: mughaliyaa-riyawaat
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: STORE_NAME
        value: Mughaliyaa Riyawaat
      - key: STORE_PHONE
        sync: false
      - key: STORE_WHATSAPP
        sync: false
      - key: STORE_EMAIL
        sync: false
      - key: STORE_ADDRESS
        value: Rawalpindi, Punjab, Pakistan
      - key: STORE_LAT
        value: "33.6844"
      - key: STORE_LNG
        value: "73.0479"
      - key: ADMIN_PHONE
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_VERIFY_SERVICE_SID
        sync: false
