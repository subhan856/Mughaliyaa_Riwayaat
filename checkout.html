{% extends "base.html" %}{% block title %}Checkout{% endblock %}{% block content %}
<section><h1>Checkout</h1><div class="checkout"><form method="post"><label>Delivery Address<textarea name="address" required placeholder="House, street, area, city"></textarea></label><div class="mapbox"><div id="map"></div><button type="button" class="btn small" onclick="locateMe()">📍 Use My Location</button></div><input type="hidden" name="lat" id="lat"><input type="hidden" name="lng" id="lng"><label>Coupon<input name="coupon" placeholder="ROYAL10"></label><label>Payment<select name="payment_method"><option value="COD">Cash on Delivery</option><option value="ONLINE">Online Payment (gateway)</option></select></label><button class="btn">PLACE ORDER</button></form><aside><h3>Order Summary</h3>{% for x in items %}<p>{{x.product.name}} × {{x.qty}} — PKR {{ "{:,.0f}".format(x.line) }}</p>{% endfor %}<hr><b>Total PKR {{ "{:,.0f}".format(total) }}</b></aside></div></section>
<script>
const map=L.map('map').setView([{{store_lat}},{{store_lng}}],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
let marker; function locateMe(){if(!navigator.geolocation)return alert('GPS not supported');navigator.geolocation.getCurrentPosition(p=>{let a=[p.coords.latitude,p.coords.longitude];document.getElementById('lat').value=a[0];document.getElementById('lng').value=a[1];map.setView(a,16);if(marker)marker.remove();marker=L.marker(a).addTo(map).bindPopup('Delivery location').openPopup();},()=>alert('Location permission allow karo.'));} 
</script>{% endblock %}
